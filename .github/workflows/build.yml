name: Build OrangeFox Recovery for sagit

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Display disk space
        run: df -h

      - name: Free up disk space
        run: |
          echo "=== Freeing up disk space ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/azure-pipelines
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/local/lib/heroku
          sudo rm -rf /usr/local/share/powershell
          sudo apt-get clean
          sudo apt-get autoremove -y
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/install-dependencies.log"
          report_result() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              tail -100 "$log" || true
              summary=$(tail -5 "$log" | tr '\n' ' ' | cut -c1-1200)
              echo "::error::Dependency installation failed (exit $rc): $summary"
            else
              tail -20 "$log"
            fi
          }
          trap report_result EXIT
          {
            sudo systemctl disable --now apt-daily.timer apt-daily-upgrade.timer || true
            sudo systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service || true
            sudo dpkg --configure -a
            sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 update
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 60 \
              "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF23C5A6CF475977595C89F51BA6932366A755776" \
              | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/deadsnakes.gpg
            echo "deb [signed-by=/usr/share/keyrings/deadsnakes.gpg] https://ppa.launchpadcontent.net/deadsnakes/ppa/ubuntu jammy main" \
              | sudo tee /etc/apt/sources.list.d/deadsnakes.list
            sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 update
            sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 install -y \
              git-core python2.7 python3 git-lfs aria2 \
              zlib1g-dev openjdk-11-jdk libssl-dev libncurses5 \
              bison flex gperf libxml2-utils lz4 \
              lib32ncurses5-dev lib32z1 lib32stdc++6 zip \
              libncurses5-dev libtinfo5 libssl-dev \
              build-essential bc cpio
            sudo ln -sf /usr/bin/python2.7 /usr/bin/python2
            sudo ln -sf /usr/bin/python2.7 /usr/bin/python
            python --version
            java -version
            mkdir -p $HOME/.bin
            curl https://storage.googleapis.com/git-repo-downloads/repo > $HOME/.bin/repo
            chmod a+rx $HOME/.bin/repo
            echo "export PATH=$HOME/.bin:$PATH" >> $HOME/.bashrc
            export PATH=$HOME/.bin:$PATH
            repo --version
          } >"$log" 2>&1

      - name: Sync OrangeFox sources (fox_16.0)
        run: |
          export PATH=$HOME/.bin:$PATH
          cd $HOME
          # fox_16.0 uses repo init directly (sync script may not support 16.0 yet)
          mkdir -p $HOME/fox_16.0
          cd $HOME/fox_16.0
          repo init -u https://gitlab.com/OrangeFox/manifest.git -b fox_16.0 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          echo "=== Sync complete ==="
          df -h

      - name: Setup device tree
        run: |
          cd $HOME/fox_16.0
          mkdir -p device/xiaomi
          # sagit fox_9.0 tree is self-contained (no common tree dependency for R12)
          # Clone the official device tree directly
          git clone --depth=1 https://gitlab.com/OrangeFox/device/sagit.git -b fox_9.0 device/xiaomi/sagit
          # Copy our custom device tree files from this repo (overrides official)
          cp -f $GITHUB_WORKSPACE/Android.mk device/xiaomi/sagit/
          cp -f $GITHUB_WORKSPACE/AndroidProducts.mk device/xiaomi/sagit/
          cp -f $GITHUB_WORKSPACE/BoardConfig.mk device/xiaomi/sagit/
          cp -f $GITHUB_WORKSPACE/device.mk device/xiaomi/sagit/
          cp -f $GITHUB_WORKSPACE/twrp_sagit.mk device/xiaomi/sagit/
          cp -f $GITHUB_WORKSPACE/vendorsetup.sh device/xiaomi/sagit/
          cp -f $GITHUB_WORKSPACE/recovery.fstab device/xiaomi/sagit/
          cp -f $GITHUB_WORKSPACE/system.prop device/xiaomi/sagit/
          echo "=== Device tree setup complete ==="
          ls -la device/xiaomi/sagit/

      - name: Customize theme (avatar + credits)
        run: |
          cd $HOME/fox_16.0
          # 1) About 页面的维护者头像：主题资源 Default/About/maintainer.png
          echo "=== Avatar targets ==="
          find bootable/recovery/gui/theme -path "*About/maintainer.png" -print
          find bootable/recovery/gui/theme -path "*About/maintainer.png" -exec cp -f $GITHUB_WORKSPACE/avatar.png {} \;

          # 2) Credits：定位 "R12 interface refresh" 所在文件并插入维护者名字
          #    动态读取匹配行的前导空白并继承它，确保与官方原文对齐（顶格显示）。
          echo "=== Credits candidates ==="
          hits=$(grep -rl "R12 interface refresh" bootable vendor device 2>/dev/null | head -5)
          echo "$hits"
          for f in $hits; do
            echo "--- original indent in $f ---"
            grep -B1 -A2 "R12 interface refresh" "$f" | cat -A
            awk '{
              indent = $0;
              sub(/[^ \t].*/, "", indent);
              print;
              if (/R12 interface refresh/) {
                print indent "ZiLing_Fox (sagit maintainer)"
              }
            }' "$f" > "$f.new" && mv "$f.new" "$f"
            echo "patched: $f"
            grep -B1 -A6 "R12 interface refresh" "$f"
          done

      - name: Build OrangeFox Recovery
        run: |
          cd $HOME/fox_16.0
          set +e
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=sagit
          export LC_ALL="C"
          echo "=== Sourcing envsetup.sh ==="
          source build/envsetup.sh
          echo "=== envsetup.sh done, exit: $? ==="
          echo "=== Running lunch ==="
          lunch twrp_sagit-eng
          echo "=== lunch done, exit: $? ==="
          echo "=== Starting build ==="
          mka adbd recoveryimage 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== Build exit code: $BUILD_EXIT ==="
          echo "=== Disk space after build ==="
          df -h
          exit $BUILD_EXIT

      - name: Show build output
        if: always()
        run: |
          ls -lh $HOME/fox_16.0/out/target/product/sagit/*.img 2>/dev/null || echo "No .img files found"
          ls -lh $HOME/fox_16.0/out/target/product/sagit/*.zip 2>/dev/null || echo "No .zip files found"
          echo "=== Exact image size (bytes) ==="
          stat -c '%n %s' $HOME/fox_16.0/out/target/product/sagit/*.img 2>/dev/null || echo "n/a"
          echo "=== Last 100 lines of build log ==="
          tail -100 $HOME/fox_16.0/build.log 2>/dev/null || echo "No build log"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp -f $HOME/fox_16.0/out/target/product/sagit/OrangeFox-*.img $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          cp -f $HOME/fox_16.0/out/target/product/sagit/OrangeFox-*.zip $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          cp -f $HOME/fox_16.0/out/target/product/sagit/OrangeFox-*.md5 $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          cp -f $HOME/fox_16.0/build.log $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          ls -lh $GITHUB_WORKSPACE/artifacts/

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-sagit
          path: |
            artifacts/*.img
            artifacts/*.zip
            artifacts/*.md5
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: artifacts/build.log
          retention-days: 7

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          shopt -s nullglob

          # Collect final OrangeFox artifacts only (exclude intermediate files)
          FINAL_IMG=(artifacts/OrangeFox-*.img)
          FINAL_ZIP=(artifacts/OrangeFox-*.zip)
          FINAL_MD5=(artifacts/OrangeFox-*.md5)
          ALL_ASSETS=("${FINAL_IMG[@]}" "${FINAL_ZIP[@]}" "${FINAL_MD5[@]}")

          if [ ${#ALL_ASSETS[@]} -eq 0 ]; then
            echo "::error::No OrangeFox artifacts found in artifacts/"
            exit 1
          fi

          # 统计已有 Fix 前缀的 release 数量，自动递增（与 polaris 完全一致）
          n=$(gh release list --limit 200 --json tagName --jq '[.[] | select(.tagName | startswith("Fix"))] | length')
          n=$((n+1))
          tag="Fix${n}-v12.0_1-sagit"

          # 本次更新：列出上一个 Release 到当前提交之间的改动
          prev_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          changes=""
          if [ -n "$prev_tag" ]; then
            changes=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_SHA}" \
              --jq '.commits[] | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:7] + ")"' 2>/dev/null || true)
          fi
          if [ -z "$changes" ]; then
            changes="- 维护性更新，详见提交历史"
          fi

          {
            echo "## 本次更新"
            echo
            echo "${changes}"
            echo
            echo "## 说明"
            echo
            echo "适用于 Xiaomi Mi 6（sagit）的 OrangeFox Recovery R12.0_1 非官方构建。"
            echo
            echo "- 源码基线：OrangeFox \`fox_12.1\`（FOX_INTERNAL_RELEASE R12.0）"
            echo "- 维护者：ZiLing_Fox"
            echo "- 构建：GitHub Actions / ubuntu-22.04 / commit ${GITHUB_SHA}"
            echo
            echo "## 刷入方式"
            echo
            echo '```bash'
            echo "fastboot erase recovery"
            echo "fastboot flash recovery OrangeFox-R12.0_1-Unofficial-sagit.img"
            echo "fastboot reboot recovery"
            echo '```'
            echo
            echo "也可以在已有的 Recovery 中直接刷入 .zip，刷入前建议用附带的 .md5 校验。"
            echo
            echo "> 遇到问题请带上日志提 Issue：https://github.com/KextNor/orangefox-sagit/issues/new?template=bug_report.yml"
          } > release-notes.md

          echo "Creating release: $tag"
          gh release create "$tag" "${ALL_ASSETS[@]}" \
            --title "OrangeFox R12.0_1 (${tag}) - Xiaomi Mi 6 (sagit)" \
            --notes-file release-notes.md
